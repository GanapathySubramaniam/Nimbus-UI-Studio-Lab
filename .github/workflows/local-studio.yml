name: local-studio

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: local-studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install and initialize SQLite
        run: npm run setup
      - name: Check types, tests and builds
        run: npm exec --yes --package=pnpm@12.3.4 --call "pnpm check"
      - name: Verify a fresh source installation and local startup
        run: npm run test:install
